name: Build Alisa Browser APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recreate Alisa Browser source
        shell: bash
        run: |
          cat > /tmp/alisa.b64 <<'ALISA_B64'

ALISA_B64
          base64 -d /tmp/alisa.b64 > /tmp/AlisaBrowser-source.zip
          unzip -q /tmp/AlisaBrowser-source.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/AlisaBrowser/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: AlisaBrowser
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: cp AlisaBrowser/app/build/outputs/apk/debug/app-debug.apk AlisaBrowser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlisaBrowser-APK
          path: AlisaBrowser-debug.apk
          if-no-files-found: error
          retention-days: 30

